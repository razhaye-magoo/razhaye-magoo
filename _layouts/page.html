---
layout: default
---
<article data-progress>
  <header class="gHead">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
<style>
.gHead{padding:36px 0 24px;border-bottom:2px solid var(--line);margin-bottom:30px;}
.gHead h1{font-family:var(--fhead);font-size:clamp(30px,5vw,56px);font-weight:900;
  margin:0 0 14px;line-height:1.03;letter-spacing:-.035em;max-width:20ch;text-wrap:balance;}
.gHead p{font-size:clamp(15.5px,1.7vw,18px);font-weight:300;color:var(--soft);
  max-width:60ch;margin:0;line-height:1.85;text-wrap:pretty;}
article .prose{max-width:68ch;}
</style>
