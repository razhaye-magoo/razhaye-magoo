---
layout: default
title: جست‌وجو
description: جست‌وجو در عنوان، متن و برچسب نوشته‌ها.
permalink: /search/
noindex: true
---
<div class="wrap">
  <header class="page-head">
    <div class="hero-top">
      <span class="seal" aria-hidden="true"></span>
      <span class="file">جست‌وجوی سراسری</span>
    </div>
    <h1>جست‌وجو</h1>
    <form class="searchbar" role="search">
      <input type="search" id="bigQ" name="q" placeholder="عنوان، متن یا برچسب…" autocomplete="off" aria-label="جست‌وجو در نوشته‌ها">
      <button class="btn btn-accent" type="submit">بگرد</button>
    </form>
    <p class="meta" id="sCount" role="status" style="margin-top:16px;color:var(--ink-3);font-size:14px;"></p>
  </header>

  <div id="sHits"></div>
  <div class="more-wrap"><button class="btn" type="button" id="sMore" hidden>نتایج بیشتر</button></div>
</div>

<script>
(function(){
  function ready(fn){
    if(window.siteSearch&&window.jalaliText){fn();return;}
    setTimeout(function(){ready(fn);},30);
  }
  ready(function(){
    var S=window.siteSearch,fa=window.faDigits;
    var inp=document.getElementById('bigQ'),box=document.getElementById('sHits');
    var cnt=document.getElementById('sCount'),more=document.getElementById('sMore');
    var form=document.querySelector('.searchbar');
    var PAGE=10,hits=[],shown=0;

    function dateText(p){
      var iso=p.iso||'';
      return window.jalaliText(iso,'long')||p.date||'';
    }
    function render(){
      box.innerHTML=hits.slice(0,shown).map(function(h){
        var bits=[dateText(h.p)];
        if(h.p.tags)bits.push(h.p.tags.split(' ').join(' · '));
        return '<a class="hit" href="'+h.p.url+'">'
          +'<h2>'+S.mark(h.p.title,h.words)+'</h2>'
          +'<p>'+(S.snippet(h)||'')+'</p>'
          +'<span class="meta num">'+S.esc(bits.filter(Boolean).join('   ·   '))+'</span></a>';
      }).join('');
      more.hidden=shown>=hits.length;
      more.textContent='نتایج بیشتر ('+fa(hits.length-shown)+')';
    }
    function empty(v){
      box.innerHTML='<div class="state"><span class="file">بی‌نتیجه</span>'
        +'<h2>چیزی برای «'+S.esc(v)+'» پیدا نشد</h2>'
        +'<p>می‌توانی بخشی از کلمه را بنویسی، یا از آرشیو و برچسب‌ها مرور کنی.</p>'
        +'<div class="state-acts"><a class="btn" href="'+window.SITE.archive+'">آرشیو نوشته‌ها</a>'
        +'<a class="btn" href="'+window.SITE.home+'">خانه</a></div></div>';
      more.hidden=true;
    }
    function search(v,push){
      v=String(v||'').trim();
      if(push){
        var u=v?location.pathname+'?q='+encodeURIComponent(v):location.pathname;
        history.replaceState(null,'',u);
      }
      if(!v){box.innerHTML='';cnt.textContent='';more.hidden=true;return;}
      cnt.textContent='در حال جست‌وجو…';
      S.load().then(function(){
        hits=S.query(v);
        shown=Math.min(PAGE,hits.length);
        cnt.textContent=hits.length?fa(hits.length)+' نتیجه برای «'+v+'»':'';
        if(!hits.length)empty(v);else render();
      });
    }
    more.addEventListener('click',function(){shown=Math.min(shown+PAGE,hits.length);render();});
    form.addEventListener('submit',function(e){e.preventDefault();search(inp.value,true);});
    var deb=null;
    inp.addEventListener('input',function(){
      clearTimeout(deb);
      deb=setTimeout(function(){search(inp.value,true);},200);
    });
    var q0=new URLSearchParams(location.search).get('q');
    if(q0){inp.value=q0;search(q0,false);}
    inp.focus();
  });
})();
</script>
